# ==============================================================================
# ResearchPilot — Render Deployment Blueprint (render.yaml)
# ==============================================================================
# This Blueprint automates the provisioning of:
# 1. Managed PostgreSQL database with pgvector extension enabled.
# 2. FastAPI backend Docker web service with persistent upload disk.
# 3. React SPA frontend static site.
#
# Documentation: docs/RENDER_DEPLOYMENT_GUIDE.md
# ==============================================================================

version: "1"

databases:
  - name: researchpilot-db
    databaseName: researchpilot
    user: researchpilot
    plan: starter # $7/mo. Note: Free tier databases expire after 30 days and are unsuited for persistent production storage.
    postgresMajorVersion: "16"
    region: oregon # Supported regions: oregon, frankfurt, ohio, singapore, virginia

services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: researchpilot-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter # $7/mo. Starter plan ensures 24/7 continuous execution without spin-down interruptions for multi-agent jobs.
    region: oregon
    healthCheckPath: /api/v1/health

    # Persistent disk for uploaded PDFs and knowledge base documents
    # Note: Disks require Starter plan or above. Remove disk block if testing on Free plan.
    disk:
      name: researchpilot-uploads
      mountPath: /app/uploads
      sizeGB: 5

    envVars:
      # Application Configuration
      - key: APP_NAME
        value: ResearchPilot
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: /api/v1

      # Database Connection (Automatically injected by Render from managed DB)
      - key: DATABASE_URL
        fromDatabase:
          name: researchpilot-db
          property: connectionString

      # Storage & File Limits
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: MAX_REQUEST_BODY_SIZE_MB
        value: "30"

      # Authentication & Bootstrap Secrets
      - key: SECRET_KEY
        generateValue: true # Render automatically generates a cryptographically secure 256-bit token
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: INITIAL_ADMIN_EMAIL
        value: admin@researchpilot.local
      - key: INITIAL_ADMIN_PASSWORD
        sync: false # Set securely in the Render Dashboard during or after Blueprint sync

      # AI Provider Mode & External Keys
      # PROVIDER_MODE: "auto" uses live keys if supplied; otherwise falls back to deterministic mock simulation
      - key: PROVIDER_MODE
        value: auto
      - key: BILLABLE_OPERATIONS_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false # Google AI Studio API Key (Leave empty to run in Mock mode)
      - key: TAVILY_API_KEY
        sync: false # Tavily Search API Key (Leave empty to run in Mock mode)

      # CORS & Networking
      - key: CORS_ORIGINS
        value: "*" # Set to your frontend Render URL in production (e.g. https://researchpilot-web.onrender.com)

      # Billing & Budget Safety Ceilings
      - key: GLOBAL_DAILY_BUDGET_USD
        value: "50.0"
      - key: GLOBAL_MONTHLY_BUDGET_USD
        value: "500.0"
      - key: DEFAULT_JOB_RESERVATION_USD
        value: "0.05"
      - key: FREE_TIER_COMPLIMENTARY_BALANCE_USD
        value: "1.00"
      - key: STRIPE_MODE
        value: mock
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Static Site (100% Free on Render)
  # ----------------------------------------------------------------------------
  - type: web
    name: researchpilot-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: researchpilot-api
          property: host


# ==============================================================================
# ResearchPilot — Render Free Deployment Blueprint (render.yaml)
# ==============================================================================
# 100% Free Tier Deployment Configuration:
# - PostgreSQL 16 with pgvector on Render Free plan (30-day expiration).
# - FastAPI backend Docker Web Service on Render Free plan (ephemeral uploads).
# - React SPA frontend Web Service with static runtime (100% Free).
#
# Complete Guide & Limitations: docs/RENDER_FREE_DEPLOYMENT_GUIDE.md
# ==============================================================================

version: "1"

databases:
  - name: researchpilot-db
    databaseName: researchpilot
    user: researchpilot
    plan: free # Render Free tier (1GB storage, expires after 30 days; see backup instructions in docs/RENDER_FREE_DEPLOYMENT_GUIDE.md)
    postgresMajorVersion: "16"
    region: oregon # Supported regions: oregon, frankfurt, ohio, singapore, virginia

services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: researchpilot-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free # Render Free tier (512MB RAM, spins down after 15m of inactivity)
    region: oregon
    healthCheckPath: /api/v1/health

    # Storage note: Persistent Disks are not supported on Render Free plan.
    # Uploaded PDFs reside in ephemeral container storage (/app/uploads) and do not survive restarts.
    # Chunk text and 768-dim vector embeddings remain persisted in PostgreSQL.

    envVars:
      # Application Configuration
      - key: APP_NAME
        value: ResearchPilot
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: /api/v1

      # Database Connection (Automatically injected by Render from managed DB)
      - key: DATABASE_URL
        fromDatabase:
          name: researchpilot-db
          property: connectionString

      # Temporary / Ephemeral Upload Storage
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: MAX_REQUEST_BODY_SIZE_MB
        value: "30"

      # Authentication & Bootstrap Secrets
      - key: SECRET_KEY
        generateValue: true # Render automatically generates a cryptographically secure 256-bit token
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: INITIAL_ADMIN_EMAIL
        value: admin@researchpilot.local
      - key: INITIAL_ADMIN_PASSWORD
        sync: false # Set securely in the Render Dashboard during or after Blueprint sync

      # Operational Safety Switches & AI Provider Settings
      # BILLABLE_OPERATIONS_ENABLED: false initially protects against unexpected external API spend.
      - key: BILLABLE_OPERATIONS_ENABLED
        value: "false"
      - key: PROVIDER_MODE
        value: auto
      - key: GEMINI_API_KEY
        sync: false # Google AI Studio API Key (Leave empty to run in Mock mode)
      - key: TAVILY_API_KEY
        sync: false # Tavily Search API Key (Leave empty to run in Mock mode)

      # CORS & Networking
      - key: CORS_ORIGINS
        value: "*" # Set to your frontend Render URL in production (e.g. https://researchpilot-web.onrender.com)

      # Billing & Budget Safety Ceilings (Mock Mode by default)
      - key: GLOBAL_DAILY_BUDGET_USD
        value: "50.0"
      - key: GLOBAL_MONTHLY_BUDGET_USD
        value: "500.0"
      - key: DEFAULT_JOB_RESERVATION_USD
        value: "0.05"
      - key: FREE_TIER_COMPLIMENTARY_BALANCE_USD
        value: "1.00"
      - key: STRIPE_MODE
        value: mock # Real payments strictly disabled
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Static Site (100% Free on Render)
  # ----------------------------------------------------------------------------
  - type: web
    name: researchpilot-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: researchpilot-api
          property: host

